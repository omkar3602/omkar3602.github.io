<html>
    <head>
        <style>
            body {
                background-color: #191919;
            }
            #widget {
                font-size: 1.5rem;
                font-weight: 500;
                line-height: 3rem;
                color: #d4d4d4;
                background-color: #191919;

                display: inline;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif,
                    "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            }
        </style>
    </head>
    <body>
    <div id="widget"></div>
    </body>
    <script>
        document.getElementById('widget').innerHTML = new Date().toLocaleDateString('en-US', {
            month: 'long',
            day: 'numeric',
            year: 'numeric'
        });
    </script>
</html>
